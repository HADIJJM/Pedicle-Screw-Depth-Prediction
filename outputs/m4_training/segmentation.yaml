# Member 4 training configuration. CLI flags in scripts/train_segmentation.py override these.
# Data/model settings must match Member 2 (configs/preprocessing.json) and Member 3 (unet3d.py).
run_name: unet3d_baseline
train_manifest: outputs/m2_preprocessing/train.csv
val_manifest: outputs/m2_preprocessing/val.csv   # never point these at test.csv
output_root: outputs/m4_training

patch_size_zyx: [96, 96, 96]   # each >= 32 and divisible by 16; reduce if GPU memory is short
batch_size: 1
patches_per_case: 12
num_workers: 0
validation_overlap: 0.25
channels: [16, 32, 64, 128, 256]

epochs: 100
learning_rate: 0.001
weight_decay: 0.00001
warmup_epochs: 2
min_lr: 0.000001
grad_clip_norm: 12.0
amp: true                      # only active on CUDA

val_every: 2                   # validation (full stitched Dice) is slow; raise if needed
early_stop_patience: 0         # validation rounds without improvement; 0 = off
seed: 42
device: auto                   # auto | cpu | cuda | cuda:0
log_every: 20
